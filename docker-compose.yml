services:
  mysql:
    image: mysql:8.4
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: campus_market
      MYSQL_USER: campus_market
      MYSQL_PASSWORD: campus_market_2026
      MYSQL_ROOT_PASSWORD: root_2026_change_me
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    image: campus-market-backend:1.0.0-amd64
    platform: linux/amd64
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: jdbc:mysql://mysql:3306/campus_market?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: campus_market
      DB_PASSWORD: campus_market_2026
      APP_UPLOAD_DIR: /app/uploads
      SEED_DEMO_DATA: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      JWT_SECRET: campus-market-compose-secret-key-2026-change-before-production
      TZ: Asia/Shanghai
    volumes:
      - ./resources/uploads:/app/uploads

  frontend:
    image: campus-market-frontend:1.0.0-amd64
    platform: linux/amd64
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mysql-data:
